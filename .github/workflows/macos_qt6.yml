name: PetCore Push Build for macOS with Qt6

on: 
  workflow_dispatch:
  release:
    types: [prereleased]

jobs:
# =================================================================================== MACOS
  macOS:
    name: Push build for macOS ARM
    runs-on: macos-14
    defaults:
      run:
        working-directory: ./scripts
    steps:
      - name: Checking out sources
        uses: actions/checkout@master
      - name: Restoring submodules
        run: git submodule update --force --recursive --init --remote
# --------------------------------------------------------
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
# --------------------------------------------------------
      - name: Install Packages 
        run: |
          brew update
          brew install openssl@3
# --------------------------------------------------------
      - name: Build PetCore with dependencies
        id: create_dmg      
        run: |
          chmod +x ./build_macos_qt6.sh
          ./build_macos_qt6.sh
          version=$(cat ../petcore_version)            # read version from file
          echo "VERSION=$version" >> $GITHUB_OUTPUT    # write version to environment variable
      - name: Upload PetCore binaries to release
        id: upload_dmg
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: install/PetCore-${{ steps.create_dmg.outputs.VERSION }}.dmg
          asset_name: PetCore-${{ steps.create_dmg.outputs.VERSION }}-x86_64-arm.dmg
          tag: ${{ github.ref }}
          overwrite: true 